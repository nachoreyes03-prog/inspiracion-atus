name: Cambios en Referencias

# The site's "Subir" button (and "+ Agregar" and "Sacar") opens a GitHub issue titled "Cambios…"
# whose body ends with a ```json block: pages to add, references to take out, ★ sites, folders.
# scripts/robot.mjs applies it to data.js, and this answers and closes the issue.
# Older issues titled "Agregar: site.com" or "Sacar: Name" still work.
on:
  issues:
    types: [opened]
  workflow_dispatch: # to add a page by hand from the Actions tab, or to try a json of changes
    inputs:
      url:
        description: "Link de la web"
        default: ""
      cambios:
        description: "O un json de cambios, como el del issue (para probar)"
        default: ""
      prueba:
        description: "Poné 1 para probar sin guardar nada (lo que sale queda como artifact)"
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: agregar
  cancel-in-progress: false

jobs:
  robot:
    # Only the repo owner's issues: anyone can open an issue on a public repo
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, 'Cambios') || startsWith(github.event.issue.title, 'Agregar') || startsWith(github.event.issue.title, 'Sacar')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar los cambios
        id: robot
        run: node scripts/robot.mjs
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          URL: ${{ inputs.url }}
          CHANGES: ${{ inputs.cambios }}
          DRY_RUN: ${{ inputs.prueba == '1' && '1' || '0' }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Guardar
        id: save
        if: steps.robot.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data.js index.html img
          git commit -m "Referencias: $SUMMARY"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
        env:
          SUMMARY: ${{ steps.robot.outputs.summary }}

      - name: Subir lo de la prueba
        if: inputs.prueba == '1'
        uses: actions/upload-artifact@v4
        with:
          name: prueba
          path: out/

      - name: Responder y cerrar el issue
        if: always() && github.event_name == 'issues'
        run: |
          if [ "$CHANGED" = 1 ] && [ "$SAVED" != success ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "No pude guardar los cambios en el repo. El detalle está en la pestaña Actions."
            exit 1
          fi
          [ -s out/reply.md ] || { mkdir -p out; echo "El robot falló. El detalle está en la pestaña Actions." > out/reply.md; }
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file out/reply.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.robot.outputs.changed }}
          SAVED: ${{ steps.save.outcome }}

  # "Buscar más" in Descubrir opens an issue titled "Buscar: law firm": search those words in the
  # galleries now (scripts/fetch-live.mjs with SEARCH) and keep searching them in every sweep
  buscar:
    if: github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Buscar')
    runs-on: ubuntu-latest
    # Same group as live.yml: both write live.js
    concurrency:
      group: live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar en las galerías
        id: search
        run: node scripts/fetch-live.mjs
        env:
          SEARCH: ${{ github.event.issue.body }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Guardar
        id: save
        run: |
          if git diff --quiet -- live.js && [ -z "$(git status --porcelain -- scripts/rubros-extra.txt)" ]; then
            echo "Sin novedades"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add live.js scripts/rubros-extra.txt
          git commit -m "En vivo: $SUMMARY"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
        env:
          SUMMARY: ${{ steps.search.outputs.summary }}

      - name: Responder y cerrar el issue
        if: always()
        run: |
          if [ "${{ steps.save.outcome }}" != success ] || [ ! -s out/reply.md ]; then
            mkdir -p out; echo "No pude buscar: el detalle está en la pestaña Actions." > out/reply.md
          fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file out/reply.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
