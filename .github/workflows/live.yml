name: Referencias en vivo

on:
  schedule:
    - cron: "17 */6 * * *" # cada 6 horas
  workflow_dispatch: # para correrlo a mano desde la pestaña Actions
    inputs:
      paginas:
        description: "Páginas a leer de Minimal Gallery y One Page Love (10 webs cada una). Poné 100 para traer las viejas."
        default: "2"

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Traer webs de las galerías
        run: node scripts/fetch-live.mjs
        env:
          PAGES: ${{ inputs.paginas || '2' }}

      - name: Guardar si hay novedades
        run: |
          if git diff --quiet -- live.js; then
            echo "Sin novedades"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add live.js
          git commit -m "En vivo: webs nuevas de las galerías"
          git pull --rebase
          git push
