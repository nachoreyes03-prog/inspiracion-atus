name: Referencias en vivo

on:
  schedule:
    - cron: "17 10 * * *" # todos los días, 07:17 en Argentina
  workflow_dispatch: # para correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Traer las webs nuevas de las galerías
        run: node scripts/fetch-live.mjs

      - name: Guardar si hay novedades
        run: |
          if git diff --quiet -- live.js; then
            echo "Sin novedades"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add live.js
          git commit -m "En vivo: webs nuevas de las galerías"
          git push
