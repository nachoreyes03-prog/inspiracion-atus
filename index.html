<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspiración Atus</title>
<meta name="description" content="Archivo de webs de referencia de Atus: capturas, tipografías, paletas y prompts para pedir diseños así.">
<meta name="theme-color" content="#F4F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151613" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Host+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=20261019-1">
<link rel="stylesheet" href="botones.css?v=20261019-1">
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="mark" href="#referencias" id="mark">Inspiración Atus</a>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" type="button" data-tab="refs" aria-controls="view-refs">Referencias <span class="n" id="n-refs"></span></button>
      <button class="tab" role="tab" type="button" data-tab="discover" aria-controls="view-discover">Descubrir <span class="n" id="n-live"></span></button>
      <button class="tab" role="tab" type="button" data-tab="mix" aria-controls="view-mix">Mezclar <span class="n" id="n-mix"></span></button>
      <button class="tab" role="tab" type="button" data-tab="taste" aria-controls="view-taste">Gusto</button>
    </nav>
  </div>
</header>

<main>
  <section class="view wrap" id="view-refs" role="tabpanel" aria-label="Referencias">
    <div class="toolbar">
      <div class="search">
        <label class="vh" for="q">Buscar</label>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Buscá: dentista, portfolio, lima…">
      </div>
      <div class="frow scroll-row" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
    <section class="also" id="ref-live" hidden></section>
  </section>

  <section class="view wrap" id="view-discover" role="tabpanel" aria-label="Descubrir" hidden>
    <div class="toolbar">
      <div class="search">
        <label class="vh" for="dq">Buscar un rubro</label>
        <input id="dq" type="search" autocomplete="off" spellcheck="false" placeholder="Buscá un rubro: dentista, restaurante, hotel…">
      </div>
      <div class="frow scroll-row" id="d-ideas"></div>
      <div class="frow scroll-row" id="d-links"></div>
    </div>
    <div class="live-head" id="live-head" data-pour="contain">
      <p class="meta" id="live-meta"></p>
      <button class="btn sm solid" type="button" id="live-shuffle" data-tip="Webs que no viste">Otra tanda</button>
    </div>
    <div class="saved-bar" id="saved-bar" hidden></div>
    <div class="filters" id="live-filters"></div>
    <div class="grid" id="live-grid"></div>
    <div class="live-more"><button class="btn" type="button" id="live-more" hidden>Ver más</button></div>
  </section>

  <section class="view wrap" id="view-mix" role="tabpanel" aria-label="Mezclar" hidden>
    <div class="mix">
      <div class="mix-col">
        <div class="picker" id="mix-picker"></div>
        <label class="fld"><span>Qué vas a diseñar</span><input class="in" id="mix-what" autocomplete="off" placeholder="La web de un estudio de arquitectura"></label>
        <div class="aspects" id="mix-aspects"></div>
        <label class="check"><input type="checkbox" id="mix-taste" checked> Sumar mi gusto</label>
      </div>
      <div class="mix-out">
        <div class="codebox">
          <div class="codebox-head"><span>Prompt</span><div class="head-actions" data-pour="below"><button class="btn sm ghost" type="button" id="mix-reset" data-tip="Borra toda la mezcla">Reset</button><button class="btn sm solid" type="button" id="mix-copy" data-tip="Para pegarle a Claude">Copiar</button></div></div>
          <pre id="mix-out"></pre>
        </div>
      </div>
    </div>
  </section>

  <section class="view wrap" id="view-taste" role="tabpanel" aria-label="Gusto" hidden>
    <div class="taste" id="taste-body"></div>
  </section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" id="sheet-scrim"></div>
  <div class="sheet-panel" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head" data-pour="below contain">
      <span class="sheet-title" id="sheet-title"></span>
      <button class="btn sm ghost icon" type="button" id="sheet-prev" aria-label="Anterior" data-tip="Anterior">←</button>
      <button class="btn sm ghost icon" type="button" id="sheet-next" aria-label="Siguiente" data-tip="Siguiente">→</button>
      <button class="btn sm icon" type="button" id="sheet-close" aria-label="Cerrar" data-tip="Cerrar · Esc">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="confirm" id="confirm" aria-labelledby="confirm-text">
  <p id="confirm-text"></p>
  <div class="confirm-actions">
    <button class="btn ghost" type="button" id="confirm-no">Cancelar</button>
    <button class="btn solid" type="button" id="confirm-yes">Sí</button>
  </div>
</dialog>

<!-- The ?v= number changes on every update so phones never mix an old app.js with a new page -->
<script src="data.js?v=20261019-1"></script>
<script src="botones.js?v=20261019-1"></script>
<script src="app.js?v=20261019-1"></script>
</body>
</html>
